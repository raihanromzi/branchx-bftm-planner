# Local Postgres for development and tests (ADR 0005).
# `npm run db:up` starts it. bftm_dev is for `npm run dev`; bftm_test is for `npm test`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bftm_dev
    ports:
      - "5432:5432"
    volumes:
      - bftm-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bftm_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  bftm-postgres:
