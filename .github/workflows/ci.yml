# Runs the same checks as the Definition of Done in CLAUDE.md.
# Vercel deploys separately through its Git integration: a pushed branch gets a preview, main goes to production.
name: CI

on:
  push:
    branches: [main, "feature/**"]
    # Gate commits and release records change docs only; nothing to check.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bftm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bftm_test

    steps:
      - uses: actions/checkout@v5

      # Until story E0-S1 scaffolds the app there is nothing to check.
      - name: Detect app
        id: app
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet (E0-S1 not built). Skipping checks."
          fi

      - uses: actions/setup-node@v5
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.app.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.present == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck

      - name: Migrate test database
        if: steps.app.outputs.present == 'true'
        run: npm run db:migrate

      - name: Unit and integration tests
        if: steps.app.outputs.present == 'true'
        run: npm test

      - name: Install Playwright browser
        if: steps.app.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      # The unit tests truncate bftm_test, which removes the default template "Umum". The e2e tests get
      # their own freshly migrated database, as bftm_dev is locally.
      - name: Create and migrate e2e database
        if: steps.app.outputs.present == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bftm_e2e
        run: |
          psql postgresql://postgres:postgres@localhost:5432/bftm_test -c 'create database bftm_e2e'
          npm run db:migrate

      - name: End-to-end tests (mobile, tablet, desktop)
        if: steps.app.outputs.present == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bftm_e2e
        run: npm run test:e2e

      - name: Build
        if: steps.app.outputs.present == 'true'
        run: npm run build

      - name: Upload Playwright report
        if: failure() && steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
